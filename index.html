<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN STORE - Online Shopping in Bangladesh</title>
    <style>
        :root {
            --daraz-orange: #f85606;
            --daraz-dark: #212121;
            --bg-light: #eff0f5;
            --white: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--daraz-dark); padding-bottom: 65px; }

        /* Daraz Header */
        header {
            background: linear-gradient(90deg, #f85606, #ff6a00);
            padding: 10px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-top { display: flex; align-items: center; gap: 10px; }
        .brand-name { color: var(--white); font-weight: 800; font-size: 18px; white-space: nowrap; }
        .search-bar { flex: 1; display: flex; background: var(--white); border-radius: 6px; padding: 3px; align-items: center; }
        .search-bar input { width: 100%; border: none; outline: none; padding: 6px 8px; font-size: 13px; }
        .search-btn { background: var(--daraz-orange); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .cart-btn { position: relative; color: white; font-size: 20px; cursor: pointer; padding: 2px 5px; }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #ffe600; color: #000; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 10px; }

        /* Promo Slider */
        .slider-container { margin: 10px 12px; border-radius: 10px; overflow: hidden; height: 130px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .slide { width: 100%; height: 100%; display: none; padding: 18px; color: white; flex-direction: column; justify-content: center; }
        .slide.active { display: flex; }
        .slide-1 { background: linear-gradient(120deg, #f85606, #d32f2f); }
        .slide-2 { background: linear-gradient(120deg, #1a237e, #283593); }
        .slide h2 { font-size: 18px; margin-bottom: 4px; }
        .slide p { font-size: 12px; opacity: 0.95; }

        /* Categories */
        .cat-section { background: var(--white); margin: 0 12px 10px; padding: 12px 8px; border-radius: 10px; }
        .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
        .cat-item { cursor: pointer; }
        .cat-icon { width: 42px; height: 42px; margin: 0 auto 4px; background: #fff3ed; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid #ffd8c4; }
        .cat-item.active .cat-icon { background: var(--daraz-orange); border-color: var(--daraz-orange); }
        .cat-name { font-size: 11px; font-weight: 500; }

        /* Flash Sale Bar */
        .flash-sale { background: var(--white); margin: 0 12px 10px; padding: 10px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .flash-title { color: var(--daraz-orange); font-weight: 800; font-size: 14px; }
        .timer span { background: var(--daraz-dark); color: white; padding: 2px 5px; border-radius: 3px; font-size: 11px; font-weight: bold; }

        /* Product Grid */
        .section-header { padding: 4px 12px 8px; font-size: 15px; font-weight: 700; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 12px; }
        .product-card { background: var(--white); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; flex-direction: column; position: relative; }
        .discount-badge { position: absolute; top: 0; right: 0; background: var(--daraz-orange); color: white; font-size: 10px; font-weight: bold; padding: 3px 6px; border-bottom-left-radius: 6px; }
        .stock-out-overlay { position: absolute; top: 55px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .img-box { width: 100%; height: 145px; background: #f9f9f9; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .p-details { padding: 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-title { font-size: 12.5px; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-price { color: var(--daraz-orange); font-size: 16px; font-weight: 700; }
        .p-old { color: #9e9e9e; font-size: 11px; text-decoration: line-through; margin-left: 4px; }
        .p-rating { font-size: 11px; color: #faca51; margin: 3px 0 6px; }
        .p-rating span { color: #9e9e9e; margin-left: 3px; }
        .card-actions { display: flex; gap: 4px; }
        .btn-add-cart { flex: 1; background: #fff0e8; color: var(--daraz-orange); border: 1px solid var(--daraz-orange); padding: 5px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-buy-now { flex: 1; background: var(--daraz-orange); color: white; border: none; padding: 5px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .empty-msg { grid-column: span 2; text-align: center; padding: 40px 15px; background: var(--white); border-radius: 8px; color: #777; font-size: 14px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--white); width: 100%; max-width: 500px; border-radius: 14px 14px 0 0; padding: 18px; max-height: 88vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 12px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
        .btn-confirm { width: 100%; padding: 12px; background: var(--daraz-orange); color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .auth-tab { flex: 1; padding: 8px; border: 1px solid var(--daraz-orange); background: #fff; color: var(--daraz-orange); font-weight: bold; border-radius: 5px; cursor: pointer; }
        .auth-tab.active { background: var(--daraz-orange); color: #fff; }
        .auth-notice { background: #fff3ed; border-left: 3px solid var(--daraz-orange); padding: 8px 10px; font-size: 12px; margin-bottom: 12px; color: #333; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e0e0e0; z-index: 90; }
        .nav-btn { text-align: center; font-size: 11px; color: #666; cursor: pointer; }
        .nav-btn.active { color: var(--daraz-orange); font-weight: bold; }
        .nav-btn div { font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="brand-name">SN STORE</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search in SN STORE..." onkeyup="filterProducts()">
                <button class="search-btn" onclick="filterProducts()">Search</button>
            </div>
            <div class="cart-btn" onclick="openCart()">🛒<span class="cart-badge" id="cartCount">0</span></div>
        </div>
    </header>

    <div class="slider-container">
        <div class="slide slide-1 active">
            <h2>SN STORE মেগা অফার!</h2>
            <p>সকল ক্যাটাগরির সেরা মানের পণ্যে চলছে বিশেষ মূল্যছাড়</p>
        </div>
        <div class="slide slide-2">
            <h2>সারা বাংলাদেশে হোম ডেলিভারি</h2>
            <p>পণ্য হাতে পেয়ে যাচাই করে টাকা পরিশোধের সুবিধা</p>
        </div>
    </div>

    <div class="cat-section">
        <div class="cat-grid">
            <div class="cat-item active" onclick="filterCategory('All', this)"><div class="cat-icon">🛍️</div><div class="cat-name">সব পণ্য</div></div>
            <div class="cat-item" onclick="filterCategory('Electronics', this)"><div class="cat-icon">📱</div><div class="cat-name">ইলেকট্রনিক্স</div></div>
            <div class="cat-item" onclick="filterCategory('Fashion', this)"><div class="cat-icon">👕</div><div class="cat-name">ফ্যাশন</div></div>
            <div class="cat-item" onclick="filterCategory('Gadgets', this)"><div class="cat-icon">🎧</div><div class="cat-name">গ্যাজেট</div></div>
            <div class="cat-item" onclick="filterCategory('Others', this)"><div class="cat-icon">📦</div><div class="cat-name">অন্যান্য</div></div>
        </div>
    </div>

    <div class="flash-sale">
        <div class="flash-title">⚡ Flash Sale</div>
        <div class="timer"><span id="hrs">05</span> : <span id="mins">42</span> : <span id="secs">19</span></div>
    </div>

    <div class="section-header">Just For You (সকল পণ্য)</div>
    <div class="product-grid" id="productGrid"></div>

    <!-- Account Registration & Login Modal -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>SN STORE অ্যাকাউন্ট</h3>
                <span style="font-size:22px; cursor:pointer;" onclick="closeAuthModal()">&times;</span>
